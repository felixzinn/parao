[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dynamic = ["version"]
name = "parao"
authors = [{ name = "B. Fischer", email = "b.fis@cern.ch" }]
description = "Parametrized Object enabled Workflows"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

[tool.hatch.version]
path = "src/parao/__init__.py"

[project.urls]
Repository = "https://gitlab.com/bfis/parao"
Issues = "https://gitlab.com/bfis/parao/issues"

[tool.hatch.envs.hatch-test]
extra-dependencies = ["pytest-cov", "pytest-subtests"]

# [tool.hatch.envs.test.scripts]
# run-coverage = "pytest --cov-config=pyproject.toml --cov=pkg --cov=tests"
# run = "run-coverage --no-cov"

[tool.coverage.run]
core = "ctrace" # HACK for coveragepy/issues/2167
source_pkgs = ["parao", "tests"]
branch = true
parallel = true
omit = ["src/parao/__about__.py"]

[tool.coverage.paths]
parao = ["src/parao", "*/parao/src/parao"]
tests = ["tests", "*/parao/tests"]

[tool.coverage.report]
exclude_also = ["^ *def +.+: +\\.\\.\\.$", "^ *if TYPE_CHECKING:"]

[tool.ruff.lint]
extend-select = ["I", "UP", "N", "ERA", "PL"]
extend-ignore = ["N818", "PLR09", "PLW2901"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["N80", "PLR2004"]
